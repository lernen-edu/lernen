broken_program: |
  def group_by_parity(numbers, buckets={"even": [], "odd": []}):
      """Partition numbers into a dict with 'even' and 'odd' lists.

      Order within each bucket follows first-seen order in `numbers`.
      """
      for n in numbers:
          if n % 2 == 0:
              buckets["even"].append(n)
          else:
              buckets["odd"].append(n)
      return buckets
test_scaffold: |
  from solution import group_by_parity


  def test_single_call():
      assert group_by_parity([1, 2, 3, 4]) == {"even": [2, 4], "odd": [1, 3]}


  def test_independent_calls():
      first = group_by_parity([1, 2])
      second = group_by_parity([3, 4])
      assert first == {"even": [2], "odd": [1]}
      assert second == {"even": [4], "odd": [3]}


  def test_explicit_bucket_arg():
      target = {"even": [], "odd": []}
      out = group_by_parity([5, 6], target)
      assert out is target
      assert out == {"even": [6], "odd": [5]}


  def test_empty():
      assert group_by_parity([]) == {"even": [], "odd": []}
