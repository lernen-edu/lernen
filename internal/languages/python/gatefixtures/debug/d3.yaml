id: d3
tier: 2
broken_program: |
  def binary_search(arr, target):
      """Return the index of target in sorted arr, or -1 if absent."""
      lo = 0
      hi = len(arr) - 1
      while lo <= hi:
          mid = (lo + hi) // 2
          if arr[mid] == target:
              return mid
          if arr[mid] < target:
              hi = mid - 1
          else:
              lo = mid + 1
      return -1
test_scaffold: |
  from solution import binary_search


  def test_found_middle():
      assert binary_search([1, 3, 5, 7, 9], 5) == 2


  def test_found_first():
      assert binary_search([1, 3, 5, 7, 9], 1) == 0


  def test_found_last():
      assert binary_search([1, 3, 5, 7, 9], 9) == 4


  def test_absent_low():
      assert binary_search([1, 3, 5, 7, 9], 0) == -1


  def test_absent_between():
      assert binary_search([1, 3, 5, 7, 9], 6) == -1


  def test_found_in_even_length():
      assert binary_search([2, 4, 6, 8], 8) == 3
